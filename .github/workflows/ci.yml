name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ========================================
  # Detect which services changed
  # ========================================
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            contracts:
              - 'contracts/**'

  # ========================================
  # Smart Contracts — only when contracts/** changed
  # ========================================
  contracts:
    name: Smart Contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace contracts

      - name: Build contracts
        run: npm run build --workspace contracts

      - name: Run tests
        run: NODE_OPTIONS="--max-old-space-size=2048" npm run test --workspace contracts -- --runInBand

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./contracts/coverage/lcov.info
          flags: contracts
          name: contracts-coverage

  # ========================================
  # Backend — only when backend/** changed
  # ========================================
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loyalty_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace backend

      - name: Generate Prisma Client
        run: npm run db:generate --workspace backend

      - name: Run database migrations
        run: npm run db:migrate:prod --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loyalty_test?schema=public

      - name: Lint
        run: npm run lint --workspace backend

      - name: Build
        run: npm run build --workspace backend

      - name: Run tests
        run: npm run test:coverage --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loyalty_test?schema=public
          JWT_SECRET: test-secret-key-for-ci-testing-minimum-32-chars
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

  # ========================================
  # Frontend — only when frontend/** changed
  # ========================================
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace frontend

      - name: Lint
        run: npm run lint --workspace frontend

      - name: Build
        run: npm run build --workspace frontend
        env:
          VITE_API_URL: http://localhost:3001/api/v1
          VITE_TON_NETWORK: testnet

      - name: Run tests
        run: npm run test --workspace frontend -- --run || echo "No tests found, skipping"
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  # ========================================
  # Docker Build — только на push в main, после всех сервисов
  # ========================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [changes, contracts, backend, frontend]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure')

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: false
          tags: loyalty-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          tags: loyalty-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_TON_NETWORK=mainnet
