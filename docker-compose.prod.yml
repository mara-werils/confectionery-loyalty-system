services:
  postgres:
    image: postgres:15-alpine
    container_name: sweet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SweetLoyalty2026!
      POSTGRES_DB: loyalty_db
    volumes:
      - sweet_postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sweet-network

  redis:
    image: redis:7-alpine
    container_name: sweet-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - sweet_redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sweet-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: sweet-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://postgres:SweetLoyalty2026!@postgres:5432/loyalty_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: SweetLoyaltyJWT2026SuperSecretKeyForDiploma!
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
      TON_NETWORK: testnet
      TON_ENDPOINT: https://testnet.toncenter.com/api/v2/jsonRPC
      TON_API_KEY: ""
      LOYALTY_TOKEN_ADDRESS: kQBNOiJ4aToE-Ea12DpY5nBmu1bKT0axt81JmS9BFPh8nCio
      ADMIN_MNEMONIC: "urban pen piano despair daring stick outside satoshi doll offer gas gesture regular kid vault miss pig scrap angry nerve phrase shadow soon mango"
      JETTON_DECIMALS: "9"
      ADMIN_EMAIL: admin@sweetloyalty.kz
      ADMIN_PASSWORD: "MasterKey2026!"
      TELEGRAM_BOT_TOKEN: "8350474859:AAHbG1t4L7aXp4GbH7OwUixs078Zu7HCKDI"
      MINI_APP_URL: "https://confectionery-loyalty-system-fronte.vercel.app/customer/dashboard"
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sweet-network

networks:
  sweet-network:
    driver: bridge

volumes:
  sweet_postgres_data:
  sweet_redis_data:
